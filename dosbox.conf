# dosbox.conf -- Laboratorio Post1 Unidad 5 (Parte 1)
# Se coloca en la raiz del proyecto y se inicia con: dosbox.exe -conf dosbox.conf

[cpu]
# velocidad adecuada para trabajo agil con NASM
core=normal
cputype=auto
cycles=8000   # corrida 1: valor de referencia del laboratorio
# cycles=1000   # corrida 2: valor bajo (comentar la linea de arriba y descomentar esta)
# cycles=20000  # corrida 3: valor alto (idem)

[dosbox]
memsize=16

[render]
# escala la ventana 2x para mejor visibilidad
scaler=normal2x

[autoexec]
# Montar el directorio del proyecto como unidad C:
mount c "C:\Users\Cesar\salas-post1-u5"
c:
# nasm.exe y cwsdpmi.exe viven en la raiz: se agregan al PATH para usarlos desde src\
path %PATH%;C:\
# nasm.exe (DJGPP) necesita un host DPMI residente en DOSBox
cwsdpmi -p > nul
echo DOSBox listo. Directorio de trabajo: C:\
cls
